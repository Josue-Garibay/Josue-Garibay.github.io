<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de control de citas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="centrar">

    <div class="Contorno"></div>
    <h1 class = "letras-titulo">SISTEMA DE REGISTRO DE CITAS</h1>
    
    <div class="cuadro1"> 
        <h2 class="letras-inSe"> Iniciar Sesion</h2>
        <form id="form">
            
            <h3 class="letras-margen"> Correo </h3>
            <div class="cuadro2">
                <input id="correo" class="entrada-Texto" placeholder="nombre@email.com">
            </div>

            <h3 class="letras-margen"> Contraseña </h3>
            <div class="cuadro2">
                <input id="contrasena" class="entrada-Texto" placeholder="********">
            </div>

            <div class="boton-centro">
                <button type="submit">Ingresar</button>
            </div>
        </form>
    </div>

    <p id="mensaje"></p>
    <script src = "js/tryCatch.js"></script>
    
</body>
</html>
